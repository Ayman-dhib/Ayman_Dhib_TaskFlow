<main class="max-w-6xl mx-auto p-4">
  <header class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-bold">TaskFlow</h1>
    <span>Favoris ({{ favorites.count() }})</span>
    <button (click)="theme.toggle()">
      {{ theme.theme() === 'light' ? '🌙' : '☀️' }}
    </button>
  </header>

  <div class="flex gap-6">
    <aside class="w-56 shrink-0">
      <h2 class="font-semibold mb-2">Récemment consultés</h2>
      @for (p of recentService.recent(); track p.id) {
        <p class="text-sm py-1">{{ p.name }}</p>
      } @empty {
        <p class="text-sm text-gray-500">Aucun projet consulté</p>
      }
    </aside>

    <section class="flex-1">
      <app-view-toggle [(view)]="currentView" />

      <div class="mt-4">
        @if (currentView() === 'task') {
          <app-project-list />
        } @else {
          <app-user-list />
        }
      </div>
    </section>
  </div>
  @if (notification.message()) {
  <div class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded">
    {{ notification.message() }}
  </div>
}
</main>
