<ul class="space-y-2">
  @for (task of tasks(); track task.id) {
    <li>
      <app-task-item
        [task]="task"
        [showAssignee]="showAssignee()"
        [assigneeName]="getAssigneeName(task.assigneeId)" />
    </li>
  } @empty {
    <li class="text-sm italic text-slate-400">Aucune tâche.</li>
  }
</ul>
