<div class="mb-6 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Rechercher un projet..."
    class="w-full md:w-1/3 bg-white border border-slate-300 rounded-lg px-4 py-2 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />

  <button
    class="px-4 py-2 rounded-lg bg-green-600 hover:bg-green-700 text-white text-sm font-medium shadow-sm transition"
    (click)="openCreate()">
    {{ showForm() && !selectedProject() ? 'Fermer le formulaire' : '+ Ajouter un projet' }}
  </button>
</div>

@if (showForm()) {
  <div class="mb-8 bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
    <app-project-form
      [projectToEdit]="selectedProject()"
      (projectSaved)="onSave($event)"
      (cancelled)="closeForm()" />
  </div>
}

<div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3 items-start">
  @for (project of filteredProjects(); track project.id) {
    <div class="flex flex-col gap-2">
      <app-project-card
        [project]="project"
        (taskStatusChange)="onTaskStatusChange($event)" />
      <button
        class="self-end px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium"
        (click)="onEdit(project)">
        ✏️ Modifier
      </button>
    </div>
  }
</div>

@if (filteredProjects().length === 0) {
  <p class="text-center text-slate-500 mt-10">Aucun projet trouvé.</p>
}
