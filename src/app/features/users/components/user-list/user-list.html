<div class="p-4">
  <input
    type="text"
    class="w-full md:w-1/2 border rounded px-3 py-2 mb-4"
    placeholder="Rechercher un utilisateur..."
    [(ngModel)]="searchTerm" />

  @if (filteredUsers().length === 0) {
    <app-empty-state message="Aucun utilisateur trouvé" />
  } @else {
    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
      @for (user of filteredUsers(); track user.id) {
        <app-user-card
          [user]="user"
          [projects]="projects()"
          (userSelected)="onUserSelected($event)" />
      }
    </div>
  }
</div>
